<!doctype html>
<html lang="en">
<head>
  <!-- offline fallback page -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — FullStackMearn</title>
  <meta name="theme-color" content="#0d0d0d">
  <link rel="stylesheet" href="base.css">
  <style>
    .offline-page { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1rem; padding:4rem 1.5rem; }
    .offline-icon { font-size:4rem; opacity:0.4; animation:pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:0.4;transform:scale(1);} 50%{opacity:0.7;transform:scale(1.04);} }
    .offline-msg { color:var(--color-muted); font-style:italic; max-width:360px; }
    .home-btn { margin-top:1rem; padding:0.65rem 1.8rem; border:1px solid var(--color-accent-dim); border-radius:var(--radius); color:var(--color-accent); text-decoration:none; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; transition:background var(--transition); }
    .home-btn:hover { background:rgba(201,169,110,0.08); opacity:1; }
  </style>
</head>
<body>
  <main class="offline-page">
    <span class="offline-icon">🌑</span>
    <h1>You are offline</h1>
    <p class="offline-msg">No network connection detected. Cached pages are still available — go home to browse what's been saved.</p>
    <a class="home-btn" href="index.html">← Go Home</a>
  </main>
</body>
</html>
