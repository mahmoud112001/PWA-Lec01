<!doctype html>
<html lang="en">
<head>
  <!-- 404 error page -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <meta name="theme-color" content="#0d0d0d">
  <link rel="stylesheet" href="base.css">
  <style>
    .error-page { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1rem; padding:4rem 1.5rem; }
    .error-code { font-family:var(--font-display); font-size:clamp(5rem,20vw,9rem); color:var(--color-border); line-height:1; user-select:none; }
    .error-msg { color:var(--color-muted); font-style:italic; max-width:360px; }
    .home-btn { margin-top:1rem; padding:0.65rem 1.8rem; border:1px solid var(--color-accent-dim); border-radius:var(--radius); color:var(--color-accent); text-decoration:none; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; transition:background var(--transition); }
    .home-btn:hover { background:rgba(201,169,110,0.08); opacity:1; }
  </style>
</head>
<body>
  <main class="error-page">
    <p class="error-code">404</p>
    <h1>Page Not Found</h1>
    <p class="error-msg">The page you were looking for doesn't exist or has been moved.</p>
    <a class="home-btn" href="index.html">← Go Home</a>
  </main>
</body>
</html>
